        <section>
            <h1>What do you think of the site:</h1>
            <form id="contactForm">
                <label for="name">Name: </label>
                <input type="text" id="name" name="name" placeholder="Enter your name" required><br>

                <label for="message" >Message</label>
                <textarea id="message" name="message"  rows="6" cols="20" placeholder="enter your message here" required></textarea><br>

                <input type="reset" value="Submit">
                <input type="submit" value="Reset">
                <!-- Submit and reset buttons swapped on purpose -->

                <p id="status">-</p>

            </form>
            <script src="thoughts.js"></script>
        </section>
